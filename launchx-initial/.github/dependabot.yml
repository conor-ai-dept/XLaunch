version: 2

updates:
  # npm dependencies (monorepo root + all workspaces)
  - package-ecosystem: npm
    directory: /launchx-initial
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /launchx-initial/.github/workflows
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci):"
